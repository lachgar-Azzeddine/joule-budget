apiVersion: v1
kind: ServiceAccount
metadata:
  name: joule-budget
  namespace: {{ .Release.Namespace }}
  labels: {{- include "joule-budget.labels" . | nindent 4 }}
---
# Cluster scope: budgets, tenants (read, cordon) and events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: joule-budget
  labels: {{- include "joule-budget.labels" . | nindent 4 }}
rules:
  - apiGroups: ["joule.azzhomelab.tech"]
    resources: ["energybudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["joule.azzhomelab.tech"]
    resources: ["energybudgets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["capsule.clastix.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: joule-budget
  labels: {{- include "joule-budget.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: joule-budget
subjects:
  - kind: ServiceAccount
    name: joule-budget
    namespace: {{ .Release.Namespace }}
---
# Inside tenant namespaces only: sleep and wake the tenant's workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: joule-budget-tenant
  labels: {{- include "joule-budget.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kamaji.clastix.io"]
    resources: ["tenantcontrolplanes"]
    verbs: ["get", "list", "patch"]
{{- if .Values.bindTenantRoleClusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: joule-budget-tenant
  labels: {{- include "joule-budget.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: joule-budget-tenant
subjects:
  - kind: ServiceAccount
    name: joule-budget
    namespace: {{ .Release.Namespace }}
{{- end }}
