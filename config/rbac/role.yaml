---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: joule-budget
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - capsule.clastix.io
  resources:
  - tenants
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - joule.azzhomelab.tech
  resources:
  - energybudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - joule.azzhomelab.tech
  resources:
  - energybudgets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kamaji.clastix.io
  resources:
  - tenantcontrolplanes
  verbs:
  - get
  - list
  - patch
